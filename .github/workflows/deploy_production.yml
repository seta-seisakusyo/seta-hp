name: Deploy_Production

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # develop / PR は速いフィードバックのため進行中の実行をキャンセルするが、
  # main（本番デプロイ）は途中キャンセルするとアプリ停止やマイグレーション中断で
  # 本番が中途半端な状態に残りうるため、キャンセルせずキュー実行する。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: seta-seisakusyo/seta-hp

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/app_db
    services:
      mysql:
        image: mysql:8.0.40
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: next/yarn.lock

      - name: Install dependencies
        working-directory: ./next
        run: yarn install --frozen-lockfile

      - name: Replay migrations on a fresh database
        working-directory: ./next
        run: yarn prisma migrate deploy

      - name: Run lint
        working-directory: ./next
        run: yarn lint

      - name: Run typecheck
        working-directory: ./next
        run: yarn typecheck

      - name: Run tests
        working-directory: ./next
        run: yarn test

      - name: Build production application
        working-directory: ./next
        run: yarn build

      - name: Validate Nginx configuration
        run: bash scripts/test-nginx-config.sh

  build-and-push:
    needs: ci
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./next
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_SECRET_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 10m
          envs: IMAGE_TAG,GH_PAT,GH_USERNAME
          script: |
            set -e

            COMPOSE_DIR=~/seta-hp
            REGISTRY=ghcr.io
            IMAGE=seta-seisakusyo/seta-hp
            FULL_IMAGE="${REGISTRY}/${IMAGE}:${IMAGE_TAG}"

            echo "=== Deploying ${FULL_IMAGE} ==="

            cd "${COMPOSE_DIR}"

            # 設定ファイルをデプロイ対象SHAから同期（イメージに含まれないインフラ設定）
            echo "Syncing config files from ${IMAGE_TAG}..."
            git fetch origin main --quiet
            if ! git cat-file -e "${IMAGE_TAG}^{commit}" 2>/dev/null; then
              # mainに含まれないSHA（workflow_dispatch等）→ 全refをfetch
              echo "SHA not found in main, fetching all refs..."
              git fetch origin --quiet
              if ! git cat-file -e "${IMAGE_TAG}^{commit}" 2>/dev/null; then
                echo "ERROR: commit ${IMAGE_TAG} not found in repository"
                exit 1
              fi
            fi
            for dir in nginx scripts fail2ban logwatch; do
              rm -rf "${dir}"
            done
            git checkout "${IMAGE_TAG}" -- docker-compose.yml nginx/ scripts/ fail2ban/ logwatch/

            # レジストリログイン
            echo "${GH_PAT}" | docker login "${REGISTRY}" -u "${GH_USERNAME}" --password-stdin

            # 指定SHAのイメージをpull
            docker pull "${FULL_IMAGE}"

            # アプリ停止前に、同期したテンプレートとentrypointでNginx設定を検証する。
            echo "Validating Nginx configuration..."
            IMAGE_TAG="${IMAGE_TAG}" docker compose -f docker-compose.yml run --rm --no-deps \
              -e NGINX_TEST_ONLY=1 nginx

            # 現在のIMAGE_TAGを保持（障害調査・手動ロールバック用）
            PREV_TAG=$(grep '^IMAGE_TAG=' .env 2>/dev/null | cut -d= -f2 || echo "")
            echo "Previous IMAGE_TAG: ${PREV_TAG:-none}"

            # 破壊的migration中に旧Prisma Clientが削除列へアクセスしないよう、
            # ここから新アプリのhealth確認までは明示的なメンテナンス時間とする。
            echo "Stopping the previous application for database maintenance..."
            docker compose -f docker-compose.yml stop next

            # Composeと同じenv_file/environmentを使い、対象イメージでmigrationする。
            # 失敗時に旧アプリを自動復帰すると新schemaとの非互換があり得るため停止状態を維持する。
            echo "Running database migrations..."
            if ! IMAGE_TAG="${IMAGE_TAG}" docker compose -f docker-compose.yml run --rm --no-deps next \
              node node_modules/prisma/build/index.js migrate deploy
            then
              echo "ERROR: Database migration failed. The previous application remains stopped to protect schema compatibility."
              echo "Previous IMAGE_TAG: ${PREV_TAG:-none}"
              exit 1
            fi

            # IMAGE_TAGを.envに書き出してcompose起動
            echo "Updating IMAGE_TAG=${IMAGE_TAG}"
            sed -i '/^IMAGE_TAG=/d' .env 2>/dev/null || true
            echo "IMAGE_TAG=${IMAGE_TAG}" >> .env

            # アプリ更新
            docker compose -f docker-compose.yml up -d --no-deps next

            # ヘルスチェック（ホスト側からcurlで確認）
            echo "Waiting for health check..."
            for i in $(seq 1 20); do
              if curl -sf http://localhost:2999/api/health > /dev/null 2>&1; then
                echo "Health check passed!"
                break
              fi
              if [ "$i" -eq 20 ]; then
                echo "ERROR: Health check failed after 100s."
                echo "Current IMAGE_TAG: ${IMAGE_TAG}"
                echo "Previous IMAGE_TAG: ${PREV_TAG:-none}"
                docker compose -f docker-compose.yml logs next --tail=20
                exit 1
              fi
              sleep 5
            done

            # SSL証明書を準備してからNginxを一度だけ再作成する。
            # 証明書の有無でコマンドを分岐していたが、certbot/conf/live は root所有の 0700 で
            # デプロイ実行ユーザーからは stat できず、判定が常に「無い」側に倒れていた（renew側は一度も実行されていない）。
            # certbotサービス既定の `certonly --keep-until-expiring` は
            # 「無ければ取得・期限が近ければ更新・それ以外は何もしない」を1コマンドで満たすため、分岐自体を廃止する。
            # 一時的な取得失敗でデプロイを落とさないよう `|| true` にするが、
            # 証明書が本当に無ければ直後のNginx起動とhealthcheckが失敗するので見逃しにはならない。
            echo "Ensuring SSL certificate is present and up to date..."
            docker compose --profile certbot run --rm certbot || true

            # 同期したentrypoint/templateと更新済み証明書を確実に反映し、外部経路のhealthも確認する。
            echo "Recreating Nginx with the deployed configuration..."
            docker compose -f docker-compose.yml up -d --no-deps --force-recreate nginx
            echo "Waiting for Nginx health check..."
            for i in $(seq 1 20); do
              NGINX_HEALTH=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' nginx_proxy 2>/dev/null || echo missing)
              if [ "${NGINX_HEALTH}" = "healthy" ]; then
                echo "Nginx health check passed!"
                break
              fi
              if [ "$i" -eq 20 ]; then
                echo "ERROR: Nginx health check failed after 100s (status: ${NGINX_HEALTH})."
                docker compose -f docker-compose.yml logs nginx --tail=40
                exit 1
              fi
              sleep 5
            done

            # 古いイメージのクリーンアップ（直近3世代を保持、CreatedAtで時系列ソート）
            echo "Cleaning up old images..."
            docker images "${REGISTRY}/${IMAGE}" --format '{{.CreatedAt}}\t{{.Tag}}\t{{.ID}}' \
              | grep -v '<none>' | grep -v 'latest' \
              | sort -r | tail -n +4 \
              | awk -F'\t' '{print $3}' | xargs -r docker rmi 2>/dev/null || true

            echo "=== Deployment complete: ${IMAGE_TAG} ==="
