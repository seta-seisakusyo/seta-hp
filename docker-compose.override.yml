# ローカル開発用の既定設定。本番処理は必ず -f docker-compose.yml を明示する。
# 起動時のDB同期にはデータ損失を強制できる db push を使わず、migration履歴だけを適用する。
services:
  next:
    build: ./next
    command: sh -c "yarn install --frozen-lockfile && npx prisma generate && npx prisma migrate deploy && yarn dev -H 0.0.0.0 -p 3000"
    ports:
      - "${DEV_BIND_ADDRESS:-0.0.0.0}:${DEV_PORT:-3001}:3000"
    volumes:
      - ./next:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      NEXTAUTH_URL: ${DEV_NEXTAUTH_URL:-http://192.168.11.8:3001}
      NEXTAUTH_TRUST_HOST: "true"
      WATCHPACK_POLLING: "true"
      # docker-compose.yml の SSO Cookie 設定は本番(https + kaza-love.com)専用のベタ書き。
      # ローカルは http + IP で参照するため、そのままだとセッションCookieが
      # __Secure- 接頭辞 / Domain=.kaza-love.com / Secure 付きで発行され、
      # ブラウザが保存を拒否してログインが成立しない（認証は通るが即座に未ログインへ戻る）。
      # 空文字にすると src/lib/auth.ts の `?.trim() || undefined` で undefined に落ち、
      # NextAuth 既定の HostOnly Cookie (authjs.session-token) に戻る。
      SSO_COOKIE_DOMAIN: ""
      SSO_COOKIE_SECURE: "0"
    mem_limit: 1g

  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/conf.d/default.conf.template:ro
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - ./uploads:/var/www/uploads:ro
