# 全コンテナ共通のログローテーション（json-file はデフォルト無制限なので上限を設定）。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  next:
    image: ghcr.io/seta-seisakusyo/seta-hp:${IMAGE_TAG:-latest}
    container_name: next_app
    logging: *default-logging
    ports:
      - "127.0.0.1:2999:3000"
    env_file:
      - ./next/.env
    environment:
      - DATABASE_URL=mysql://app_user:${MYSQL_PASSWORD:-app_pass}@mysql:3306/app_db
      # compose直下の .env から解決される（next/.env ではない。environment は env_file より優先）。
      # 未設定でも本番が安全側に倒れるよう既定は本番URL。ローカル開発は .env で上書きする（#255）。
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://kaza-love.com}
      - HOSTNAME=0.0.0.0
      # --- SSO: designer.kaza-love.com を HP管理者ログインでゲートする ---
      # Cookie を親ドメインまで広げ、auth_request 検証エンドポイントを有効化。
      - SSO_COOKIE_DOMAIN=.kaza-love.com
      - SSO_COOKIE_SECURE=1
      - SSO_VERIFY_ENABLED=1
    volumes:
      - ./uploads:/app/public/uploads
    command: node server.js
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mysql:
    image: mysql:8.0.46
    container_name: mysql_db
    logging: *default-logging
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_db}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_pass}
    command: >
      --innodb-buffer-pool-size=128M --key-buffer-size=16M --max-connections=30 --table-open-cache=200 --tmp-table-size=16M --max-heap-table-size=16M
    mem_limit: 512m
    volumes:
      - ./mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_proxy
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SERVER_NAME=${SERVER_NAME:-kaza-love.com}
      - OLD_SERVER_NAME=${OLD_SERVER_NAME:-setaseisakusyo.com}
      # Designer SSO の共有秘密（designer の Django と同値にする）。
      # 未設定なら空文字 → designer 側も非強制（後方互換）。設定時のみ偽装防止が有効。
      - PROXY_SSO_SECRET=${PROXY_SSO_SECRET:-}
      # 管理エリア（管理ページ・管理API書込）を許可するIP/CIDR（スペース区切り）。
      # 未設定なら制限なし（#248）。例: "203.0.113.10 198.51.100.0/24"
      - ADMIN_ALLOWED_IPS=${ADMIN_ALLOWED_IPS:-}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/conf.d/default.conf.template:ro
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./uploads:/var/www/uploads:ro
      # fail2ban/logwatchがホスト上で実ログを監視できるよう、標準ログパスを共有する。
      - /var/log/nginx:/var/log/nginx
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    depends_on:
      - next
    restart: unless-stopped
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # SSL証明書取得・更新用（本番環境で使用）
  certbot:
    image: certbot/certbot
    container_name: certbot
    logging: *default-logging
    profiles:
      - certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email k_ryuji@setaseisakusyo.com --agree-tos --no-eff-email --cert-name kaza-love.com --keep-until-expiring -d kaza-love.com -d www.kaza-love.com -d setaseisakusyo.com -d www.setaseisakusyo.com -d designer.kaza-love.com
